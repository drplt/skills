name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the package
        run: python3 tools/check_package.py
      - name: Build the claude.ai skill zip
        run: |
          cd plugins/droplet-forms/skills
          zip -r ../../../droplet-form-creator-skill.zip droplet-form-creator -x '*.DS_Store'
      - name: Publish the GitHub release with the zip attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/changelog_notes.py "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" droplet-form-creator-skill.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
